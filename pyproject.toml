[project]
name = "ivcap-crew-ai"
version = "0.2.0"
description = "Executes queries or chats with the CrewAI agent framework."
authors = [
    {name = "Max Ott",email = "max.ott@data61.csiro.au"}
]
readme = "README.md"

requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai[tools] (>=1.6.0,<2.0.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "ivcap-lambda (>=0.7.25,<0.8.0)",
    "datamodel-code-generator (>=0.35.0,<1.0.0)",
    "pyjwt (>=2.10.0,<3.0.0)",
    "chromadb (>=0.4.0)",
    "qdrant-client (>=1.14.3)",
    "litellm (>=1.0.0,<1.82.6)",
    "ivcap-client (>=0.44.4)",
    "python-dotenv>=1.2.1",
    "google-genai>=1.64.0",
    "langfuse>=4.13.0",
    "openinference-instrumentation-crewai>=1.1.10"
]


[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
]

[tool.poetry]
    package-mode = false

[tool.poetry.group.dev.dependencies]
cyclonedx-py = "^1.0.1"

[tool.poetry-plugin-ivcap]
service-file = "service.py"
service-id = "urn:ivcap:service:01555c28-32d0-5839-b92b-f3e52410d6dd"
service-type = "lambda"
port = 8077
policy = "urn:ivcap:policy:ivcap.open.metadata"
# docker
#docker-run-opts = ["--port", "9999" ]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"